name: nexcode
services:
  sandbox-image:
    build: ./sandbox
    image: nexcode-sandbox:local
    entrypoint: ["/bin/true"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  runner:
    build:
      context: ./backend
      target: runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run setup script first}
      SANDBOX_IMAGE: nexcode-sandbox:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [execution]
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  executor-gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes: ["./deploy/runner-proxy.conf:/etc/nginx/nginx.conf:ro"]
    networks: [execution]
    depends_on:
      runner:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=101,gid=101,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  backend:
    build:
      context: ./backend
      target: api
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DB_PATH: /data/nexcode.db
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Run setup script first}
      RUNNER_URL: http://executor-gateway:8091
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      STAFF_ACCOUNTS_FILE: ${STAFF_ACCOUNTS_FILE:-}
      LOG_PATH: /logs/nexcode.log
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}
      SEMESTER_END: ${SEMESTER_END:-}
      TRUSTED_PROXY_CIDRS: ${WEB_SUBNET:-172.29.240.0/24}
      SEED_DEMO: ${SEED_DEMO:-true}
      WORKERS: ${WORKERS:-2}
      QUEUE_CAPACITY: 64
    volumes: ["database:/data", "logs:/logs", "./config:/config:ro"]
    networks: [web, execution]
    depends_on:
      executor-gateway:
        condition: service_started
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes: ["./deploy/gateway.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"]
    networks: [web]
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,uid=101,gid=101,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  web:
    ipam:
      config:
        - subnet: ${WEB_SUBNET:-172.29.240.0/24}
  execution:
    internal: true
volumes:
  database:
  logs:
